name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run data-warden seed --url sqlite:///demo.db
      - run: uv run data-warden check --url sqlite:///demo.db --dir examples/contracts --policy examples/policy.yaml

  dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --python 3.12 /tmp/af
      - run: >
          uv pip install --python /tmp/af/bin/python "apache-airflow==3.3.2" pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: AIRFLOW_HOME=$RUNNER_TEMP/af /tmp/af/bin/airflow db migrate
      - run: AIRFLOW_HOME=$RUNNER_TEMP/af /tmp/af/bin/python -m pytest tests/test_airflow_dag.py