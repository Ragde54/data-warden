# Data contract. Generated by data-warden, then owned by humans.
# owner: who answers questions about this table.
# retention_days: how long personal data may be kept.
# pii_columns: column -> personal data type. Add columns the scanner cannot detect.
table: customers
owner: customer-data-team
retention_days: 730
pii_columns:
  col7: email
  full_name: person_name
  iban_raw: iban
  phone: phone
