services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden  # local demo only
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10