[project]
name = "data-warden"
version = "0.1.0"
description = "Scan databases for personal data, generate a catalog and data contracts, and enforce governance policies in CI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
demo = ["faker>=25"]

[project.scripts]
data-warden = "data_warden.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "faker>=25", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_warden"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
